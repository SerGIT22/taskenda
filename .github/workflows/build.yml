name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Show Android SDK information
        run: |
          echo "===== SDK INSTALADO ====="
          sdkmanager --list_installed || true

          echo ""
          echo "===== PLATAFORMAS DISPONIBLES ====="
          sdkmanager --list | sed -n '/Available Packages:/,/Available Updates:/p' | grep "platforms;android-" || true

          echo ""
          echo "===== BUILD TOOLS DISPONIBLES ====="
          sdkmanager --list | sed -n '/Available Packages:/,/Available Updates:/p' | grep "build-tools;" || true

      - name: Accept Android SDK licenses
        run: |
          sdkmanager --licenses < /dev/null || true

      - name: Prepare persistent signing key
        env:
          TASKENDA_KEYSTORE_BASE64: ${{ secrets.TASKENDA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TASKENDA_KEYSTORE_BASE64" ]; then
            echo "Falta el secret TASKENDA_KEYSTORE_BASE64"
            exit 1
          fi

          printf '%s' "$TASKENDA_KEYSTORE_BASE64" \
            | tr -d '\r\n\t ' \
            | base64 --decode > "$GITHUB_WORKSPACE/app/taskenda-debug.keystore"

          if [ ! -s "$GITHUB_WORKSPACE/app/taskenda-debug.keystore" ]; then
            echo "No se pudo crear el keystore"
            exit 1
          fi

          echo "Comprobando keystore..."

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/app/taskenda-debug.keystore" \
            -storepass "${{ secrets.TASKENDA_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.TASKENDA_KEY_ALIAS }}" \
            > /dev/null

          echo "Keystore válido y alias correcto."

      - name: Build debug APK
        env:
          TASKENDA_KEYSTORE_PATH: ${{ github.workspace }}/app/taskenda-debug.keystore
          TASKENDA_KEYSTORE_PASSWORD: ${{ secrets.TASKENDA_KEYSTORE_PASSWORD }}
          TASKENDA_KEY_ALIAS: ${{ secrets.TASKENDA_KEY_ALIAS }}
          TASKENDA_KEY_PASSWORD: ${{ secrets.TASKENDA_KEY_PASSWORD }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: No se ha generado el APK."
            exit 1
          fi

          echo "APK generado correctamente:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taskenda-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
