name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -o pipefail
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Prepare persistent signing key
        env:
          TASKENDA_KEYSTORE_BASE64: ${{ secrets.TASKENDA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$TASKENDA_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto TASKENDA_KEYSTORE_BASE64"
            exit 1
          fi

          echo "$TASKENDA_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/app/taskenda-debug.keystore"

      - name: Build debug APK
        env:
          TASKENDA_KEYSTORE_PATH: ${{ github.workspace }}/app/taskenda-debug.keystore
          TASKENDA_KEYSTORE_PASSWORD: ${{ secrets.TASKENDA_KEYSTORE_PASSWORD }}
          TASKENDA_KEY_ALIAS: ${{ secrets.TASKENDA_KEY_ALIAS }}
          TASKENDA_KEY_PASSWORD: ${{ secrets.TASKENDA_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Taskenda-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
