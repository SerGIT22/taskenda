name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Aceptar licencias Android
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail

      - name: Instalar Android SDK 37
        shell: bash
        run: |
          sdkmanager --install \
            "platforms;android-37.0" \
            "build-tools;37.0.0" \
            "platform-tools"

      - name: Verificar Android SDK instalado
        shell: bash
        run: |
          echo "=== SDK instalado ==="
          sdkmanager --list_installed | grep -E "platforms;android-37|build-tools;37|platform-tools" || true

          echo ""
          echo "=== Plataformas ==="
          ls -la "$ANDROID_SDK_ROOT/platforms"

          echo ""
          echo "=== Build Tools ==="
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      - name: Conceder permisos al Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Comprobar APK generado
        shell: bash
        run: |
          echo "=== APKs generados ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Taskenda-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
